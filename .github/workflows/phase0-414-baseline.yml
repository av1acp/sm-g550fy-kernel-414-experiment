name: Phase0 - Linux 4.14 baseline with era-matched ARM32 toolchain

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase0:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout experiment repository
        uses: actions/checkout@v7.0.1

      - name: Install host build packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex build-essential ca-certificates ccache git \
            libncurses-dev libssl-dev xz-utils

      - name: Fetch Linux 4.14 stable source
        run: |
          set -euo pipefail
          mkdir -p source
          cd source
          curl -fSL --retry 3 -o linux-4.14.tar.xz \
            https://cdn.kernel.org/pub/linux/kernel/v4.x/linux-4.14.tar.xz
          tar -xf linux-4.14.tar.xz
          mv linux-4.14 linux
          head -5 linux/Makefile

      - name: Restore cached ARM32 toolchain
        id: toolchain-cache
        uses: actions/cache@v6.1.0
        with:
          path: .toolchain/arm-eabi-4.9
          key: burstlam-arm-eabi-4.9-v1

      - name: Fetch era-matched ARM32 toolchain
        if: ${{ steps.toolchain-cache.outputs.cache-hit != 'true' }}
        run: |
          set -euo pipefail
          TC="$GITHUB_WORKSPACE/.toolchain/arm-eabi-4.9"
          mkdir -p "$(dirname "$TC")"
          rm -rf "$TC"
          git clone --quiet --depth 1 \
            https://github.com/burstlam/arm-eabi-4.9.git "$TC"

      - name: Verify cross toolchain
        run: |
          set -euo pipefail
          TC="$GITHUB_WORKSPACE/.toolchain/arm-eabi-4.9"
          for t in arm-eabi-gcc arm-eabi-ld arm-eabi-as arm-eabi-objcopy; do
            test -x "$TC/bin/$t" || { echo "MISSING $t"; exit 1; }
            echo "OK $t"
          done
          "$TC/bin/arm-eabi-gcc" --version | head -1
          "$TC/bin/arm-eabi-gcc" -dumpmachine
          file "$TC/bin/arm-eabi-gcc"

      - name: Compile Linux 4.14 ARMv7 zImage
        working-directory: source/linux
        run: |
          set -euo pipefail
          TC="$GITHUB_WORKSPACE/.toolchain/arm-eabi-4.9"
          export ARCH=arm
          export CROSS_COMPILE="$TC/bin/arm-eabi-"
          export KBUILD_BUILD_USER=phase0
          export KBUILD_BUILD_HOST=runner
          if grep -q '^YYLTYPE yylloc$' scripts/dtc/dtc-parser.tab.c_shipped; then
            sed -i '0,/^YYLTYPE yylloc$/s//extern YYLTYPE yylloc/' \
              scripts/dtc/dtc-parser.tab.c_shipped
            echo "patched dtc parser yylloc as extern"
          fi
          make multi_v7_defconfig
          scripts/config --set-str LOCALVERSION "-port-exp-phase0" || true
          make olddefconfig
          make -j"$(nproc)" zImage
          test -s arch/arm/boot/zImage
          file arch/arm/boot/zImage
          cat include/config/kernel.release
          ls -lh arch/arm/boot/zImage

      - name: Verify upstream has no Exynos3475 board support
        run: |
          set -euo pipefail
          echo "Searching Linux 4.14 upstream for Exynos3475 board support"
          # Word-boundary, case-insensitive: bare "3475" also matches
          # unrelated hex constants (e.g. e4000_priv.h).
          FOUND=$(grep -rIliw -e 'exynos3475' -e 'universal3475' \
            source/linux/arch/arm source/linux/drivers 2>/dev/null | head -10 || true)
          if [ -n "$FOUND" ]; then
            echo "UNEXPECTED upstream references:"
            echo "$FOUND"
            exit 1
          fi
          echo "CONFIRMED: Exynos3475 is Samsung-downstream only; no upstream 4.14 support"

      - name: Upload phase0 reference zImage - do not flash
        uses: actions/upload-artifact@v7.0.1
        with:
          name: linux-4.14-phase0-arm-eabi-4.9-zImage
          path: source/linux/arch/arm/boot/zImage
          if-no-files-found: error
          retention-days: 7
