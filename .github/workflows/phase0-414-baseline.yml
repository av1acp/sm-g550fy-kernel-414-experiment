name: Phase0 - Linux 4.14 baseline build test (no flash)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase0:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout experiment repo
        uses: actions/checkout@v7.0.1

      - name: Fetch Linux 4.14 source
        run: |
          set -euo pipefail
          mkdir -p source
          cd source
          curl -fSL --retry 3 -o linux-4.14.tar.xz \
            https://cdn.kernel.org/pub/linux/kernel/v4.x/linux-4.14.tar.xz
          tar -xf linux-4.14.tar.xz
          mv linux-4.14 linux
          echo "version:"
          head -5 linux/Makefile

      - name: Install ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev libncurses-dev \
            build-essential gcc-arm-linux-gnueabi gcc-arm-linux-gnueabihf \
            xz-utils ccache

      - name: Verify toolchain is ARM32
        run: |
          set -euo pipefail
          arm-linux-gnueabihf-gcc --version | head -1
          arm-linux-gnueabihf-gcc -dumpmachine
          arm-linux-gnueabihf-gcc -dumpmachine | grep -q 'arm-' \
            || (echo "FATAL: toolchain is not 32-bit ARM" && exit 1)

      - name: Phase0 baseline compile (generic ARMv7, no device)
        working-directory: source/linux
        run: |
          set -euo pipefail
          export ARCH=arm
          export CROSS_COMPILE=arm-linux-gnueabihf-
          export KBUILD_BUILD_USER=phase0
          export KBUILD_BUILD_HOST=runner
          # gcc >= 10 defaults to -fno-common; old trees' shipped dtc
          # parser+lexer both define yylloc -> link error. Make the parser
          # copy extern (same fix as our 3.10 build script).
          if grep -q '^YYLTYPE yylloc;$' scripts/dtc/dtc-parser.tab.c_shipped; then
            sed -i 's/^YYLTYPE yylloc;$/extern YYLTYPE yylloc;/' \
              scripts/dtc/dtc-parser.tab.c_shipped
            echo "applied dtc yylloc extern fix"
          fi
          # gcc >= 10 defaults to -fno-common; old dtc ships both a
          # parser and lexer copy of YYLTYPE yylloc -> duplicate symbol at
          # link. Make the parser copy extern (same fix used in the 3.10 build).
          if grep -q '^YYLTYPE yylloc;$' scripts/dtc/dtc-parser.tab.c_shipped; then
            sed -i 's/^YYLTYPE yylloc;$/extern YYLTYPE yylloc;/' \
              scripts/dtc/dtc-parser.tab.c_shipped
            echo "applied dtc yylloc extern fix"
          fi
          make multi_v7_defconfig
          scripts/config --set-str LOCALVERSION "-port-exp-phase0" || true
          make olddefconfig
          make -j"$(nproc)" zImage
          ls -la arch/arm/boot/zImage
          file arch/arm/boot/zImage
          cat include/config/kernel.release

      - name: Verify source facts (exynos3475 absent upstream)
        run: |
          set -euo pipefail
          echo "== searching upstream 4.14 for any 3475/gsi support =="
          FOUND=$(grep -rIl --include='*.[chd]' -e '3475' -e 'universal3475' \
            source/linux/arch/arm source/linux/drivers 2>/dev/null | head -5 || true)
          if [ -n "$FOUND" ]; then
            echo "UNEXPECTED: 3475 references found upstream:"
            echo "$FOUND"
          else
            echo "CONFIRMED: no Exynos3475 board support in Linux 4.14 upstream"
          fi

      - name: Upload phase0 zImage (reference only, do not flash)
        uses: actions/upload-artifact@v7.0.1
        with:
          name: linux-4.14-phase0-baseline-zImage
          path: source/linux/arch/arm/boot/zImage
          if-no-files-found: error
          retention-days: 7
