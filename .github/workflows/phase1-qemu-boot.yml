name: Phase1 - QEMU ARM virt boot proof for Linux 4.14

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase1:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout experiment repository
        uses: actions/checkout@v7.0.1

      - name: Install build + QEMU packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex build-essential ca-certificates ccache cpio git \
            libncurses-dev libssl-dev xz-utils qemu-system-arm qemu-utils \
            gcc-arm-linux-gnueabi binutils-arm-linux-gnueabi

      - name: Restore cached ARM32 toolchain
        id: toolchain-cache
        uses: actions/cache@v6.1.0
        with:
          path: .toolchain/arm-eabi-4.9
          key: burstlam-arm-eabi-4.9-v1

      - name: Fetch era-matched ARM32 toolchain
        if: ${{ steps.toolchain-cache.outputs.cache-hit != 'true' }}
        run: |
          set -euo pipefail
          TC="$GITHUB_WORKSPACE/.toolchain/arm-eabi-4.9"
          mkdir -p "$(dirname "$TC")"
          rm -rf "$TC"
          git clone --quiet --depth 1 \
            https://github.com/burstlam/arm-eabi-4.9.git "$TC"

      - name: Fetch Linux 4.14 source
        run: |
          set -euo pipefail
          mkdir -p source
          cd source
          curl -fSL --retry 3 -o linux-4.14.tar.xz \
            https://cdn.kernel.org/pub/linux/kernel/v4.x/linux-4.14.tar.xz
          tar -xf linux-4.14.tar.xz
          mv linux-4.14 linux
          head -5 linux/Makefile

      - name: Build Linux 4.14 for QEMU vexpress-a9
        working-directory: source/linux
        run: |
          set -euo pipefail
          TC="$GITHUB_WORKSPACE/.toolchain/arm-eabi-4.9"
          export ARCH=arm
          export CROSS_COMPILE="$TC/bin/arm-eabi-"
          export KBUILD_BUILD_USER=phase1
          export KBUILD_BUILD_HOST=runner
          if grep -q '^YYLTYPE yylloc$' scripts/dtc/dtc-parser.tab.c_shipped; then
            sed -i '0,/^YYLTYPE yylloc$/s//extern YYLTYPE yylloc/' \
              scripts/dtc/dtc-parser.tab.c_shipped
          fi
          make vexpress_defconfig
          make olddefconfig
          make -j"$(nproc)" zImage dtbs
          test -s arch/arm/boot/zImage
          file arch/arm/boot/zImage
          cat include/config/kernel.release
          test -s arch/arm/boot/dts/vexpress-v2p-ca9.dtb
          ls -lh arch/arm/boot/zImage arch/arm/boot/dts/vexpress-v2p-ca9.dtb

      - name: Build static ARM busybox
        run: |
          set -euo pipefail
          # busybox.net hosts no prebuilt armv7l; build it from source with
          # Ubuntu's complete ARM sysroot. The KERNEL uses the era-matched
          # toolchain above; busybox is userspace and is independent.
          curl -fSL --retry 3 -o busybox.tar.bz2 \
            https://busybox.net/downloads/busybox-1.36.1.tar.bz2
          tar -xjf busybox.tar.bz2
          cd busybox-1.36.1
          make defconfig
          sed -i 's/^# CONFIG_STATIC is not set/CONFIG_STATIC=y/' .config
          sed -i 's/^# CONFIG_FEATURE_PREFER_APPLETS is not set/CONFIG_FEATURE_PREFER_APPLETS=y/' .config
          sed -i 's/^# CONFIG_INSTALL_NO_USR is not set/CONFIG_INSTALL_NO_USR=y/' .config
          grep -q '^CONFIG_STATIC=y' .config || { echo "FATAL: CONFIG_STATIC not enabled"; exit 1; }
          yes '' | make oldconfig >/dev/null
          make -j"$(nproc)" CROSS_COMPILE=arm-linux-gnueabi- ARCH=arm
          file busybox
          arm-linux-gnueabi-readelf -h busybox | grep -E 'Class|Machine'
          if arm-linux-gnueabi-readelf -l busybox | grep -q INTERP; then
            echo "FATAL: busybox dynamically linked"; exit 1
          fi
          echo "STATIC ARM BUSYBOX OK"

      - name: Build minimal initramfs
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/initramfs"
          mkdir -p "$ROOT/bin" "$ROOT/dev" "$ROOT/proc" "$ROOT/sys" "$ROOT/tmp"
          cp busybox-1.36.1/busybox "$ROOT/bin/busybox"
          chmod +x "$ROOT/bin/busybox"
          # /init must be a real executable: use busybox itself as init
          # (kernel also accepts a shell script with shebang, but a
          # statically linked binary is the most reliable form).
          cat > "$ROOT/init" <<'EOF'
          #!/bin/sh
          /bin/busybox --install -s /bin
          mount -t proc proc /proc
          mount -t sysfs sys /sys
          mount -t devtmpfs dev /dev 2>/dev/null || true
          echo "===PHASE1_BOOT_PROOF_START==="
          /bin/busybox uname -a
          echo "PHASE1: userspace reached, PID $$"
          /bin/busybox id
          echo "===PHASE1_BOOT_PROOF_END==="
          /bin/busybox poweroff -f 2>/dev/null || /bin/busybox reboot -f
          EOF
          chmod +x "$ROOT/init"
          # /dev/console is required for the kernel to attach stdin/stdout
          # to the serial console. cpio is newc; device nodes are created
          # in the guest by devtmpfs once /init runs.
          (cd "$ROOT" && find . -print0 | cpio --null -o -H newc --quiet) \
            | gzip -1 > "$RUNNER_TEMP/initramfs.cpio.gz"
          ls -lh "$RUNNER_TEMP/initramfs.cpio.gz"
          echo "INITRAMFS READY"

      - name: Boot under QEMU vexpress-a9 (up to 3 min)
        run: |
          set -euo pipefail
          LOG="$RUNNER_TEMP/phase1-qemu.log"
          timeout 180 qemu-system-arm \
            -M vexpress-a9 \
            -cpu cortex-a9 \
            -m 512 \
            -nographic \
            -kernel source/linux/arch/arm/boot/zImage \
            -dtb source/linux/arch/arm/boot/dts/vexpress-v2p-ca9.dtb \
            -initrd "$RUNNER_TEMP/initramfs.cpio.gz" \
            -append "console=ttyAMA0 rdinit=/init panic=3 loglevel=7" \
            2>&1 | tee "$LOG" || true
          echo "=== QEMU LOG (last 80) ==="
          tail -80 "$LOG"
          if grep -q "PHASE1: userspace reached" "$LOG"; then
            echo "PHASE1_PASS: 4.14 kernel booted and reached /init"
            exit 0
          fi
          echo "PHASE1_FAIL: kernel did not reach /init within timeout"
          exit 1

      - name: Upload phase1 evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: phase1-vexpress-a9-evidence
          path: |
            source/linux/arch/arm/boot/zImage
            source/linux/arch/arm/boot/dts/vexpress-v2p-ca9.dtb
            ${{ runner.temp }}/phase1-qemu.log
          if-no-files-found: warn
          retention-days: 7
