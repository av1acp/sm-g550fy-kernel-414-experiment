name: Phase1 - QEMU vexpress-a9 boot proof for Linux 4.14

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase1:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout experiment repository
        uses: actions/checkout@v7.0.1

      - name: Install build and QEMU packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex build-essential ca-certificates ccache cpio git \
            libncurses-dev libssl-dev xz-utils qemu-system-arm qemu-utils \
            gcc-arm-linux-gnueabi binutils-arm-linux-gnueabi

      - name: Restore cached ARM32 kernel toolchain
        id: toolchain-cache
        uses: actions/cache@v6.1.0
        with:
          path: .toolchain/arm-eabi-4.9
          key: burstlam-arm-eabi-4.9-v1

      - name: Fetch era-matched ARM32 kernel toolchain
        if: ${{ steps.toolchain-cache.outputs.cache-hit != 'true' }}
        run: |
          set -euo pipefail
          TC="$GITHUB_WORKSPACE/.toolchain/arm-eabi-4.9"
          mkdir -p "$(dirname "$TC")"
          rm -rf "$TC"
          git clone --quiet --depth 1 https://github.com/burstlam/arm-eabi-4.9.git "$TC"

      - name: Fetch Linux 4.14 source
        run: |
          set -euo pipefail
          mkdir -p source
          cd source
          curl -fSL --retry 3 -o linux-4.14.tar.xz \
            https://cdn.kernel.org/pub/linux/kernel/v4.x/linux-4.14.tar.xz
          tar -xf linux-4.14.tar.xz
          mv linux-4.14 linux
          head -5 linux/Makefile

      - name: Build Linux 4.14 for QEMU vexpress-a9
        working-directory: source/linux
        run: |
          set -euo pipefail
          TC="$GITHUB_WORKSPACE/.toolchain/arm-eabi-4.9"
          export ARCH=arm
          export CROSS_COMPILE="$TC/bin/arm-eabi-"
          export KBUILD_BUILD_USER=phase1
          export KBUILD_BUILD_HOST=runner
          if grep -q '^YYLTYPE yylloc$' scripts/dtc/dtc-parser.tab.c_shipped; then
            sed -i '0,/^YYLTYPE yylloc$/s//extern YYLTYPE yylloc/' \
              scripts/dtc/dtc-parser.tab.c_shipped
          fi
          make vexpress_defconfig
          make olddefconfig
          make -j"$(nproc)" zImage dtbs
          test -s arch/arm/boot/zImage
          test -s arch/arm/boot/dts/vexpress-v2p-ca9.dtb
          file arch/arm/boot/zImage
          cat include/config/kernel.release
          ls -lh arch/arm/boot/zImage arch/arm/boot/dts/vexpress-v2p-ca9.dtb

      - name: Build tiny freestanding ARM initramfs init
        run: |
          set -euo pipefail
          # No busybox/sysroot needed. This is a minimal static ARM binary
          # that calls the Linux syscall ABI directly. It proves the 4.14
          # kernel reached userspace (/init), and then powers off.
          cat > "$RUNNER_TEMP/init.c" <<'EOF'
          typedef unsigned long ulong;
          static long sc3(long n, long a, long b, long c) {
              register long r7 __asm__("r7") = n;
              register long r0 __asm__("r0") = a;
              register long r1 __asm__("r1") = b;
              register long r2 __asm__("r2") = c;
              __asm__ volatile("svc 0" : "+r"(r0) : "r"(r7), "r"(r1), "r"(r2) : "memory");
              return r0;
          }
          static long sc0(long n, long a) {
              register long r7 __asm__("r7") = n;
              register long r0 __asm__("r0") = a;
              __asm__ volatile("svc 0" : "+r"(r0) : "r"(r7) : "memory");
              return r0;
          }
          void _start(void) {
              static const char start[] = "===PHASE1_BOOT_PROOF_START===\n";
              static const char ok[] = "PHASE1: userspace reached via /init\n";
              static const char end[] = "===PHASE1_BOOT_PROOF_END===\n";
              char uts[512];
              sc3(4, 1, (long)start, sizeof(start) - 1);
              sc0(122, (long)uts);
              sc3(4, 1, (long)ok, sizeof(ok) - 1);
              sc3(4, 1, (long)end, sizeof(end) - 1);
              /* reboot(POWER_OFF): ARM reboot syscall #142, magic values. */
              sc3(142, 0x01234567L, 0x4321fedcL, 0);
              for (;;) __asm__ volatile("wfi");
          }
          EOF
          arm-linux-gnueabi-gcc -marm -march=armv7-a -nostdlib -nostartfiles \
            -static -ffreestanding -fno-stack-protector -fno-pic \
            -Wl,-e,_start -o "$RUNNER_TEMP/init" "$RUNNER_TEMP/init.c"
          file "$RUNNER_TEMP/init"
          arm-linux-gnueabi-readelf -h "$RUNNER_TEMP/init" | grep -E 'Class|Machine'
          if arm-linux-gnueabi-readelf -l "$RUNNER_TEMP/init" | grep -q INTERP; then
            echo "FATAL: init is dynamically linked"; exit 1
          fi

          ROOT="$RUNNER_TEMP/initramfs"
          mkdir -p "$ROOT/bin" "$ROOT/dev" "$ROOT/proc" "$ROOT/sys" "$ROOT/tmp"
          cp "$RUNNER_TEMP/init" "$ROOT/init"
          chmod +x "$ROOT/init"
          sudo mknod -m 600 "$ROOT/dev/console" c 5 1
          sudo mknod -m 666 "$ROOT/dev/null" c 1 3
          sudo chown -R root:root "$ROOT"
          (cd "$ROOT" && find . -print0 | cpio --null -o -H newc --quiet) \
            | gzip -1 > "$RUNNER_TEMP/initramfs.cpio.gz"
          ls -lh "$RUNNER_TEMP/initramfs.cpio.gz"
          echo "TINY INITRAMFS READY"

      - name: Boot under QEMU vexpress-a9
        run: |
          set -euo pipefail
          LOG="$RUNNER_TEMP/phase1-qemu.log"
          timeout 180 qemu-system-arm \
            -M vexpress-a9 \
            -cpu cortex-a9 \
            -m 512 \
            -nographic \
            -kernel source/linux/arch/arm/boot/zImage \
            -dtb source/linux/arch/arm/boot/dts/vexpress-v2p-ca9.dtb \
            -initrd "$RUNNER_TEMP/initramfs.cpio.gz" \
            -append "console=ttyAMA0 rdinit=/init panic=3 loglevel=7" \
            2>&1 | tee "$LOG" || true
          echo "=== QEMU LOG (last 100) ==="
          tail -100 "$LOG"
          grep -q "PHASE1: userspace reached via /init" "$LOG"
          echo "PHASE1_PASS: 4.14 kernel booted to /init"

      - name: Upload phase1 evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: phase1-vexpress-a9-evidence
          path: |
            source/linux/arch/arm/boot/zImage
            source/linux/arch/arm/boot/dts/vexpress-v2p-ca9.dtb
            ${{ runner.temp }}/phase1-qemu.log
          if-no-files-found: warn
          retention-days: 7
