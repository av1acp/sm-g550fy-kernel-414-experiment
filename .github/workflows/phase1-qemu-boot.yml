name: Phase1 - QEMU ARM virt boot proof for Linux 4.14

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase1:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout experiment repository
        uses: actions/checkout@v7.0.1

      - name: Install QEMU ARM emulation
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-arm qemu-utils busybox-static cpio \
            gzip xz-utils ca-certificates

      - name: Restore cached ARM32 toolchain
        id: toolchain-cache
        uses: actions/cache@v6.1.0
        with:
          path: .toolchain/arm-eabi-4.9
          key: burstlam-arm-eabi-4.9-v1

      - name: Fetch era-matched ARM32 toolchain
        if: ${{ steps.toolchain-cache.outputs.cache-hit != 'true' }}
        run: |
          set -euo pipefail
          TC="$GITHUB_WORKSPACE/.toolchain/arm-eabi-4.9"
          mkdir -p "$(dirname "$TC")"
          rm -rf "$TC"
          git clone --quiet --depth 1 \
            https://github.com/burstlam/arm-eabi-4.9.git "$TC"

      - name: Fetch Linux 4.14 source
        run: |
          set -euo pipefail
          mkdir -p source
          cd source
          curl -fSL --retry 3 -o linux-4.14.tar.xz \
            https://cdn.kernel.org/pub/linux/kernel/v4.x/linux-4.14.tar.xz
          tar -xf linux-4.14.tar.xz
          mv linux-4.14 linux

      - name: Build Phase1 QEMU virt kernel
        working-directory: source/linux
        run: |
          set -euo pipefail
          TC="$GITHUB_WORKSPACE/.toolchain/arm-eabi-4.9"
          export ARCH=arm
          export CROSS_COMPILE="$TC/bin/arm-eabi-"
          export KBUILD_BUILD_USER=phase1
          export KBUILD_BUILD_HOST=runner
          if grep -q '^YYLTYPE yylloc$' scripts/dtc/dtc-parser.tab.c_shipped; then
            sed -i '0,/^YYLTYPE yylloc$/s//extern YYLTYPE yylloc/' \
              scripts/dtc/dtc-parser.tab.c_shipped
          fi
          make defconfig
          # virt board + serial console + initramfs (busybox from initramfs)
          scripts/config --enable CONFIG_ARCH_VIRT
          scripts/config --enable CONFIG_ARM_LPAE
          scripts/config --enable CONFIG_SERIAL_AMBA_PL011
          scripts/config --enable CONFIG_SERIAL_AMBA_PL011_CONSOLE
          scripts/config --enable CONFIG_BLK_DEV_INITRD
          scripts/config --enable CONFIG_INITRAMFS_SOURCE="\"\""
          scripts/config --disable CONFIG_PREEMPT_NONE
          scripts/config --enable CONFIG_PREEMPT_VOLUNTARY
          make olddefconfig
          make -j"$(nproc)" zImage
          test -s arch/arm/boot/zImage
          file arch/arm/boot/zImage
          cat include/config/kernel.release
          echo "VIRT KERNEL BUILD OK"

      - name: Build static ARM busybox initramfs
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/initramfs"
          mkdir -p "$ROOT/bin" "$ROOT/dev" "$ROOT/proc" "$ROOT/sys" "$ROOT/tmp"
          # busybox-static from Ubuntu is x86 only; use a prebuilt ARM one.
          curl -fSL --retry 3 -o "$RUNNER_TEMP/busybox-arm" \
            https://busybox.net/downloads/binaries/1.35.0-armv7l/busybox
          chmod +x "$RUNNER_TEMP/busybox-arm"
          "$RUNNER_TEMP/busybox-arm" | head -2
          cp "$RUNNER_TEMP/busybox-arm" "$ROOT/bin/busybox"
          # init script: mount pseudo-fs, print proof, power off
          cat > "$ROOT/init" <<'EOF'
          #!/bin/sh
          /bin/busybox --install -s /bin
          mount -t proc proc /proc
          mount -t sysfs sys /sys
          mount -t devtmpfs dev /dev
          echo "===PHASE1_BOOT_PROOF_START==="
          uname -a
          echo "PHASE1: userspace reached, PID $$"
          echo "===PHASE1_BOOT_PROOF_END==="
          /bin/busybox poweroff -f
          EOF
          chmod +x "$ROOT/init"
          # Build static cpio
          (cd "$ROOT" && find . -print0 | cpio --null -o -H newc --quiet) \
            | gzip -1 > "$RUNNER_TEMP/initramfs.cpio.gz"
          ls -lh "$RUNNER_TEMP/initramfs.cpio.gz"
          echo "INITRAMFS READY"

      - name: Boot Phase1 kernel under QEMU (up to 3 min)
        run: |
          set -euo pipefail
          LOG="$RUNNER_TEMP/phase1-qemu.log"
          timeout 180 qemu-system-arm \
            -M virt \
            -cpu cortex-a15 \
            -m 256 \
            -nographic \
            -kernel source/linux/arch/arm/boot/zImage \
            -initrd "$RUNNER_TEMP/initramfs.cpio.gz" \
            -append "console=ttyAMA0 rdinit=/init panic=3 loglevel=7" \
            2>&1 | tee "$LOG" || true
          echo "=== QEMU LOG (last 60) ==="
          tail -60 "$LOG"
          if grep -q "PHASE1: userspace reached" "$LOG"; then
            echo "PHASE1_PASS: 4.14 kernel booted and reached /init"
            exit 0
          fi
          echo "PHASE1_FAIL: kernel did not reach /init within timeout"
          exit 1

      - name: Upload phase1 logs and kernel
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: phase1-qemu-boot-evidence
          path: |
            source/linux/arch/arm/boot/zImage
            ${{ runner.temp }}/phase1-qemu.log
          if-no-files-found: warn
          retention-days: 7
