name: Phase4 - Exynos3475 early bring-up (pinctrl + MCT port, compile only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase4:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout experiment repository
        uses: actions/checkout@v7.0.1

      - name: Install build packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex build-essential ca-certificates ccache git \
            libncurses-dev libssl-dev xz-utils

      - name: Restore cached ARM32 toolchain
        id: toolchain-cache
        uses: actions/cache@v6.1.0
        with:
          path: .toolchain/arm-eabi-4.9
          key: burstlam-arm-eabi-4.9-v1

      - name: Fetch era-matched ARM32 toolchain
        if: ${{ steps.toolchain-cache.outputs.cache-hit != 'true' }}
        run: |
          set -euo pipefail
          TC="$GITHUB_WORKSPACE/.toolchain/arm-eabi-4.9"
          mkdir -p "$(dirname "$TC")"
          rm -rf "$TC"
          git clone --quiet --depth 1 https://github.com/burstlam/arm-eabi-4.9.git "$TC"

      - name: Fetch Linux 4.14 and donor tree
        run: |
          set -euo pipefail
          mkdir -p source
          cd source
          curl -fSL --retry 3 -o linux-4.14.tar.xz \
            https://cdn.kernel.org/pub/linux/kernel/v4.x/linux-4.14.tar.xz
          tar -xf linux-4.14.tar.xz
          mv linux-4.14 linux
          git clone --quiet --depth 1 --branch cm-14.1 \
            https://github.com/Exynos3475/android_kernel_samsung_exynos3475.git donor

      - name: Port exynos_mct clocksource to 4.14 API
        run: |
          set -uo pipefail
          cd source/linux
          # 4.14 ALREADY has an exynos_mct driver. The donor copy from 3.10
          # uses the removed asm/sched_clock.h. We must NOT overwrite the
          # upstream 4.14 version: use upstream and only register it.
          echo "=== upstream 4.14 exynos_mct.c header check ==="
          grep -n '#include' drivers/clocksource/exynos_mct.c | head -12
          echo "=== diff donor vs upstream (API changes only) ==="
          diff -u ../donor/drivers/clocksource/exynos_mct.c \
                 drivers/clocksource/exynos_mct.c | head -40 || true
          # no mechanical copy: upstream already carries Exynos MCT support.

      - name: Verify 4.14 Samsung pinctrl framework and locate Exynos3475 DT data
        run: |
          set -uo pipefail
          cd source/linux
          DONOR=../donor
          echo "=== 4.14 samsung pinctrl files (ALREADY present, do not copy donor over these) ==="
          ls -la drivers/pinctrl/samsung/pinctrl-exynos*.c 2>/dev/null || true
          echo
          echo "=== 4.14 Kconfig symbols ==="
          grep -n -E 'PINCTRL.*EXYNOS|EXYNOS.*PINCTRL' drivers/pinctrl/samsung/Kconfig || true
          echo
          echo "=== donor Exynos3475 DT sources (needed to extend 4.14 DT tables) ==="
          for f in exynos3475-pinctrl.dtsi exynos3475-universal3475-pinctrl.dtsi \
                   exynos3475.dtsi exynos3475-universal3475.dts; do
            [ -f "$DONOR/arch/arm/boot/dts/$f" ] && echo "  donor DTS: $f" || true
          done
          find "$DONOR/arch/arm/boot/dts" -maxdepth 1 -iname '*3475*' | head -20
          echo
          echo "=== clock data available in 4.14 upstream? ==="
          grep -n 'exynos3475' drivers/clk/samsung/clk-exynos4*.c 2>/dev/null | head -5 || echo "  no exynos3475 clock table in 4.14 upstream (must add)"

      - name: Compile with pinctrl+mct and report exact errors
        working-directory: source/linux
        run: |
          set -uo pipefail
          TC="$GITHUB_WORKSPACE/.toolchain/arm-eabi-4.9"
          export ARCH=arm
          export CROSS_COMPILE="$TC/bin/arm-eabi-"
          export KBUILD_BUILD_USER=phase4
          export KBUILD_BUILD_HOST=runner
          if grep -q '^YYLTYPE yylloc$' scripts/dtc/dtc-parser.tab.c_shipped; then
            sed -i '0,/^YYLTYPE yylloc$/s//extern YYLTYPE yylloc/' \
              scripts/dtc/dtc-parser.tab.c_shipped
          fi
          make exynos_defconfig
          # Exynos pinctrl lives in drivers/pinctrl/samsung (4.14 framework)
          scripts/config --enable CONFIG_PINCTRL_EXYNOS || true
          scripts/config --enable CONFIG_PINCTRL_S3C24XX || true
          scripts/config --enable CONFIG_PINCTRL_S3C64XX || true
          scripts/config --enable CONFIG_PINCTRL_SAMSUNG || true
          scripts/config --enable CONFIG_CLOCK_EXYNOS4 || true
          scripts/config --enable CONFIG_SERIAL_8250_DW || true
          scripts/config --enable CONFIG_MMC_DW || true
          make olddefconfig
          set +e
          make -k -j"$(nproc)" zImage dtbs > "$GITHUB_WORKSPACE/phase4-build.log" 2>&1
          RC=$?
          set -e
          echo "MAKE_RC=$RC"
          echo "=== exynos pinctrl/mct compile lines ==="
          grep -E 'pinctrl.*exynos|exynos_mct' "$GITHUB_WORKSPACE/phase4-build.log" | head -30 || true
          echo "=== all errors (first 30) ==="
          grep 'error:' "$GITHUB_WORKSPACE/phase4-build.log" | head -30 || true
          if [ "$RC" -eq 0 ] && [ -s arch/arm/boot/zImage ]; then
            file arch/arm/boot/zImage
            cat include/config/kernel.release
            ls -lh arch/arm/boot/zImage
            echo "PHASE4_COMPILE_PASS"
          else
            echo "PHASE4_PORT_NEEDS_WORK (expected; see exact errors)"
            exit 0
          fi

      - name: Upload phase4 evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: phase4-pinctrl-mct-port-evidence
          path: |
            ${{ github.workspace }}/phase4-build.log
            source/linux/arch/arm/boot/zImage
          if-no-files-found: warn
          retention-days: 14
