name: Phase5 - Exynos3475 board data port (clock + DT, compile only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase5:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout experiment repository
        uses: actions/checkout@v7.0.1

      - name: Install build packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex build-essential ca-certificates ccache git \
            libncurses-dev libssl-dev xz-utils

      - name: Restore cached ARM32 toolchain
        id: toolchain-cache
        uses: actions/cache@v6.1.0
        with:
          path: .toolchain/arm-eabi-4.9
          key: burstlam-arm-eabi-4.9-v1

      - name: Fetch era-matched ARM32 toolchain
        if: ${{ steps.toolchain-cache.outputs.cache-hit != 'true' }}
        run: |
          set -euo pipefail
          TC="$GITHUB_WORKSPACE/.toolchain/arm-eabi-4.9"
          mkdir -p "$(dirname "$TC")"
          rm -rf "$TC"
          git clone --quiet --depth 1 https://github.com/burstlam/arm-eabi-4.9.git "$TC"

      - name: Fetch Linux 4.14 and donor tree
        run: |
          set -euo pipefail
          mkdir -p source
          cd source
          curl -fSL --retry 3 -o linux-4.14.tar.xz \
            https://cdn.kernel.org/pub/linux/kernel/v4.x/linux-4.14.tar.xz
          tar -xf linux-4.14.tar.xz
          mv linux-4.14 linux
          git clone --quiet --depth 1 --branch cm-14.1 \
            https://github.com/Exynos3475/android_kernel_samsung_exynos3475.git donor

      - name: Copy Exynos3475 board data
        run: |
          cd source/linux
          DONOR=../donor
          LOG="$GITHUB_WORKSPACE/phase5-board-data.txt"
          {
            echo "=== BOARD DATA PORT (3.10 donor -> 4.14) ==="
            mkdir -p arch/arm/mach-exynos/include/mach
            for f in regs-clock.h regs-clock-exynos3475.h regs-clock-exynos5422.h \
                     regs-clock-exynos5430.h regs-clock-exynos5433.h; do
              if [ -f "$DONOR/arch/arm/mach-exynos/include/mach/$f" ]; then
                cp "$DONOR/arch/arm/mach-exynos/include/mach/$f" \
                   arch/arm/mach-exynos/include/mach/$f
                echo "  COPIED mach header $f"
              else
                echo "  SKIP missing mach header $f"
              fi
            done
            if [ -f "$DONOR/include/dt-bindings/clock/exynos3475.h" ]; then
              cp "$DONOR/include/dt-bindings/clock/exynos3475.h" \
                 include/dt-bindings/clock/exynos3475.h
              echo "  COPIED include/dt-bindings/clock/exynos3475.h"
              echo "  DTS refs: $(find "$DONOR/arch/arm/boot/dts" -maxdepth 1 -type f -iname '*3475*' | wc -l)"
            fi
          } | tee "$LOG" || true

      - name: Inspect 4.14 clock tables
        run: |
          cd source/linux
          echo "=== 4.14 exynos4 clock driver has 3475 table? ==="
          grep -n -i 'exynos3475' drivers/clk/samsung/clk-exynos4*.c 2>/dev/null | head -5 || true
          echo "=== available soc id table entries ==="
          grep -n 'exynos[0-9].*_clk_soc' drivers/clk/samsung/clk-exynos4*.c 2>/dev/null | head -20 || true

      - name: Compile Exynos4 base with board headers
        working-directory: source/linux
        run: |
          set -euo pipefail
          TC="$GITHUB_WORKSPACE/.toolchain/arm-eabi-4.9"
          export ARCH=arm
          export CROSS_COMPILE="$TC/bin/arm-eabi-"
          export KBUILD_BUILD_USER=phase5
          export KBUILD_BUILD_HOST=runner
          if grep -q '^YYLTYPE yylloc$' scripts/dtc/dtc-parser.tab.c_shipped; then
            sed -i '0,/^YYLTYPE yylloc$/s//extern YYLTYPE yylloc/' \
              scripts/dtc/dtc-parser.tab.c_shipped
          fi
          make exynos_defconfig
          scripts/config --enable CONFIG_PINCTRL_EXYNOS || true
          scripts/config --enable CONFIG_CLOCK_EXYNOS4 || true
          scripts/config --enable CONFIG_SERIAL_8250_DW || true
          scripts/config --enable CONFIG_MMC_DW || true
          make olddefconfig
          make -j"$(nproc)" zImage dtbs
          file arch/arm/boot/zImage
          cat include/config/kernel.release
          ls -lh arch/arm/boot/zImage
          echo "PHASE5_COMPILE_PASS"

      - name: Phase6 handoff
        run: |
          OUT="$GITHUB_WORKSPACE/phase6-handoff.txt"
          {
            echo "=== PHASE 6 HANDOFF ==="
            echo "1. CLOCK TABLE: add EXYNOS3475 to clk-exynos4.c soc_ids[]"
            echo "2. PINTCTRL DT: add exynos3475 pin bank data"
            echo "3. MACHINE INIT: port mach-exynos3475 from donor"
            echo "4. BOARD DTS: convert donor DTS to 4.14 phandle syntax"
            echo "5. TEE: MobiCore/secure_ctrl still required"
          } | tee "$OUT"

      - name: Upload phase5 evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: phase5-exynos3475-board-data-evidence
          path: |
            ${{ github.workspace }}/phase5-board-data.txt
            ${{ github.workspace }}/phase6-handoff.txt
            source/linux/arch/arm/boot/zImage
          if-no-files-found: warn
          retention-days: 14
